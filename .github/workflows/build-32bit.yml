name: Build Android APK 32-Bit & 64-Bit

on:
  workflow_dispatch: # Memunculkan tombol build manual di menu Actions

jobs:
  build:
    name: Build Native 32-Bit & 64-Bit APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Mengunduh seluruh library internal game

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Android App via Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.ndkEmbeddedAbiFilters=arm64-v8a,armeabi-v7a

      - name: Upload APK Hasil Build
        uses: actions/artifacts@v4
        with:
          name: Downhill-Revived-32bit-Debug
          path: "**/build/outputs/apk/debug/*.apk"
          
