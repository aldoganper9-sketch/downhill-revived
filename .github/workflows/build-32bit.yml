name: Build Android APK 32-Bit & 64-Bit

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Native 32-Bit & 64-Bit APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Android App via Gradle
        # Jika file build.gradle Anda ada di dalam folder tertentu, ganti tulisan setelah ./ di bawah ini
        # Contoh jika nama foldernya adalah 'android', ubah menjadi: working-directory: ./android
        # Jika semua file ada di root luar, Anda bisa menghapus baris working-directory ini.
        working-directory: .
        run: |
          gradle assembleDebug -Pandroid.ndkEmbeddedAbiFilters=arm64-v8a,armeabi-v7a

      - name: Upload APK Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: Downhill-Revived-32bit-Debug
          path: "**/build/outputs/apk/debug/*.apk"
          
